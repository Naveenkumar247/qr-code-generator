<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk QR Code Generator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 15px;
}

.container {
  max-width: 800px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
}

textarea {
  width: 100%;
  height: 140px;
  padding: 10px;
  font-size: 14px;
}

button {
  padding: 12px 18px;
  margin-top: 10px;
  background: #228B22;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button.secondary {
  background: #0066cc;
}

.qr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  margin-top: 25px;
}

.qr-card {
  text-align: center;
  background: #fafafa;
  padding: 10px;
  border-radius: 8px;
}

.qr-card img {
  width: 150px;
  height: 150px;
}

.qr-text {
  font-size: 12px;
  word-break: break-all;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Lifetime Bulk QR Code Generator</h2>

  <p>Enter one URL per line:</p>
  <textarea id="urls" placeholder="https://example.com"></textarea>

  <button onclick="generate()">Generate QR Codes</button>
  <button class="secondary" onclick="downloadZip()">Download All (ZIP)</button>

  <div class="qr-grid" id="qrGrid"></div>
</div>

<script>
let savedUrls = [];

async function generate() {
  const urls = document.getElementById("urls").value
    .split("\n")
    .map(u => u.trim())
    .filter(Boolean);

  savedUrls = urls;

  const res = await fetch("/api/qr/bulk", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ urls })
  });

  const data = await res.json();
  const grid = document.getElementById("qrGrid");
  grid.innerHTML = "";

  data.forEach(qr => {
    const div = document.createElement("div");
    div.className = "qr-card";

    div.innerHTML = `
      <img src="${qr.image}">
      <div class="qr-text">${qr.url}</div>
      <a href="${qr.image}" download="${qr.name}">
        <button class="secondary">Download</button>
      </a>
    `;

    grid.appendChild(div);
  });
}

function downloadZip() {
  fetch("/api/qr/zip", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ urls: savedUrls })
  })
  .then(res => res.blob())
  .then(blob => {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "qr_codes.zip";
    link.click();
  });
}
</script>

</body>
</html>
